<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실시간 글로벌 속보 · 한국어</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__mark">WSC</span>
      <div class="topbar__title">
        <h1>실시간 글로벌 속보</h1>
        <p class="topbar__subtitle">원문 · <a href="{{ source_url }}" target="_blank" rel="noopener">{{ source_name }}</a> — 한국어 요약 제공</p>
      </div>
    </div>
    <div class="topbar__status">
      <span class="live-dot" id="live-dot"></span>
      <span id="status-text">연결 중…</span>
    </div>
  </header>

  <main class="feed" id="feed" aria-live="polite">
    <div class="feed__empty" id="feed-empty">
      최신 속보를 불러오는 중입니다…
    </div>
  </main>

  <footer class="footnote">
    <p>
      본 서비스는 <strong>{{ source_name }}</strong>의 실시간 속보 제목과 짧은 발췌를 한국어로 번역하여 제공합니다.
      전체 기사 내용은 각 항목의 “원문 보기”를 통해 {{ source_name }} 사이트에서 확인해 주세요.
    </p>
  </footer>

</div>

<template id="item-template">
  <article class="card">
    <div class="card__time"><time></time></div>
    <div class="card__body">
      <h2 class="card__title"></h2>
      <p class="card__summary"></p>
      <a class="card__link" target="_blank" rel="noopener">원문 보기 ↗</a>
    </div>
  </article>
</template>

<script>
  window.__APP_CONFIG__ = {
    pollIntervalMs: {{ poll_interval_ms }}
  };
</script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
